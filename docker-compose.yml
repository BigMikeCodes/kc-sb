# Run keycloak server
# docker compose --profile default up

# Export realm configuration
# docker compose --profile export-realm up

volumes:
  kc-db:
  app-db:

services:

  # keycloak pg db
  kc-db:
    image: "postgres:17-alpine"
    profiles:
      - export-realm
      - default
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak_pw
      - POSTGRES_DB=keycloak
    volumes:
      - kc-db:/var/lib/postgresql/data

  # keycloak pg db
  app-db:
    image: "postgres:18-alpine"
    profiles:
      - default
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=kcsb
      - POSTGRES_PASSWORD=changeme
      - POSTGRES_DB=kcsb
    volumes:
      - app-db:/var/lib/postgresql/data

  # Flyway migrations
  flyway:
    image: "flyway/flyway:12.10-alpine"
    volumes:
      - ./flyway.conf:/flyway/conf/flyway.conf:ro
      - ./migrations:/flyway/sql:ro
    profiles:
      - default
    depends_on:
      - app-db
    command:
      - migrate

  # keycloak server
  keycloak:
    image: "quay.io/keycloak/keycloak:26.6.3"
    profiles:
      - default
    ports:
      - "8080:8080"
    environment:
      # db
      - KC_DB=postgres
      - KC_DB_URL_HOST=kc-db
      - KC_DB_URL_PORT=5432
      - KC_DB_URL_DATABASE=keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak_pw

      # admin
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin

    command: [ "start-dev", "--import-realm" ]
    volumes:
      - ./realms:/opt/keycloak/data/import
    depends_on:
      - kc-db

  # Export keycloak realm to ./realms
  keycloak-export:
    image: "quay.io/keycloak/keycloak:26.6.3"
    profiles:
      - export-realm
    environment:
      - KC_DB=postgres
      - KC_DB_URL_HOST=kc-db
      - KC_DB_URL_PORT=5432
      - KC_DB_URL_DATABASE=keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak_pw

    command: [ "export", "--realm", "test-realm" ,"--dir", "/var/export", "--verbose"]
    volumes:
      - ./realms:/var/export
    depends_on:
      - kc-db
