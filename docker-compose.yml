volumes:
  kc-db:
  terraform-state:

services:

  # keycloak pg db
  kc-db:
    image: "postgres:18-alpine"
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak_pw
      - POSTGRES_DB=keycloak
    volumes:
      - kc-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --username=keycloak --dbname=keycloak" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # keycloak server
  keycloak:
    image: "quay.io/keycloak/keycloak:26.7.0"
    environment:
      # db
      - KC_DB=postgres
      - KC_DB_URL_HOST=kc-db
      - KC_DB_URL_PORT=5432
      - KC_DB_URL_DATABASE=keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak_pw

      # admin
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded

    command: [ "start-dev" ]
    depends_on:
      kc-db:
        condition: service_healthy

    # The keycloak image is stripped down, can't use curl/ wget etc...
    # TODO: investigate using a custom image for this that is built from a docker file that has curl/wget or a custom binary
    healthcheck:
      test: [
        "CMD-SHELL",
        "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q 'HTTP/1.1 200 OK' <&3"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  terraform:
    image: hashicorp/terraform:1.15.8
    working_dir: /workspace
    volumes:
      - ./iac:/workspace
      - terraform-state:/terraform-state
    environment:
      - TF_LOG=INFO
    command: ["-chdir=/workspace", "apply", "-auto-approve"]
    depends_on:
      keycloak:
        condition: service_healthy

  # Otel sink, view logs traces & metrics
  aspire:
    image: "mcr.microsoft.com/dotnet/aspire-dashboard"


  # All inbound traffic via traefik, see config under ./traefik
  # Allows easier routing via .localhost
  proxy:
    image: "traefik:v3.7.10"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic-config.yml:/etc/traefik/dynamic/config.yml:ro
      - ./logs:/var/log/traefik/
