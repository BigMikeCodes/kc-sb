volumes:
  kc-db:
  terraform-state:

services:

  # keycloak pg db
  kc-db:
    image: "postgres:18-alpine"
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=keycloak_pw
      - POSTGRES_DB=keycloak
    volumes:
      - kc-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready --username=keycloak --dbname=keycloak" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # keycloak server
  keycloak:
    image: "quay.io/keycloak/keycloak:26.7.0"
    ports:
      - "8080:8080"
      - "9000:9000"
    environment:
      # db
      - KC_DB=postgres
      - KC_DB_URL_HOST=kc-db
      - KC_DB_URL_PORT=5432
      - KC_DB_URL_DATABASE=keycloak
      - KC_DB_USERNAME=keycloak
      - KC_DB_PASSWORD=keycloak_pw

      # admin
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true

    command: [ "start-dev", "--import-realm" ]
    volumes:
      - ./realms:/opt/keycloak/data/import
    depends_on:
      - kc-db

  terraform:
    image: hashicorp/terraform:1.15.8
    working_dir: /workspace
    volumes:
      - ./iac:/workspace
      - terraform-state:/terraform-state
    environment:
      - TF_LOG=INFO
    command: ["-chdir=/workspace", "apply", "-auto-approve"]
    depends_on:
      kc-db:
        condition: service_healthy
